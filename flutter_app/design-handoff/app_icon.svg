<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- 배경 그라디언트 (차콜 → 딥블랙) -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2C2C2E"/>
      <stop offset="100%" stop-color="#1C1C1E"/>
    </radialGradient>
    <!-- 시계 유리 반사광 -->
    <radialGradient id="glassShine" cx="40%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- 베젤 그라디언트 -->
    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A3A3C"/>
      <stop offset="50%" stop-color="#28282A"/>
      <stop offset="100%" stop-color="#1A1A1C"/>
    </linearGradient>
    <!-- 시침 그라디언트 -->
    <linearGradient id="hourHandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5E5EA"/>
      <stop offset="100%" stop-color="#AEAEB2"/>
    </linearGradient>
    <!-- 분침 그라디언트 -->
    <linearGradient id="minHandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D1D1D6"/>
    </linearGradient>
    <!-- 아이콘 둥근 사각형 클립 -->
    <clipPath id="roundedRect">
      <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224"/>
    </clipPath>
  </defs>

  <!-- 아이콘 배경 (둥근 사각형) -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" fill="url(#bgGrad)"/>

  <!-- 외부 베젤 링 -->
  <circle cx="512" cy="512" r="430" fill="url(#bezelGrad)"/>
  <!-- 베젤 하이라이트 -->
  <circle cx="512" cy="512" r="430" fill="none" stroke="#4A4A4C" stroke-width="1.5" opacity="0.8"/>

  <!-- 시계판 배경 -->
  <circle cx="512" cy="512" r="400" fill="#1C1C1E"/>
  <!-- 시계판 미묘한 그라디언트 -->
  <circle cx="512" cy="512" r="400" fill="url(#glassShine)"/>

  <!-- 12시각 눈금 (4개 주요, 8개 보조) -->
  <!-- 12시 -->
  <rect x="506" y="132" width="12" height="52" rx="6" fill="#AEAEB2"/>
  <!-- 3시 -->
  <rect x="840" y="506" width="52" height="12" rx="6" fill="#AEAEB2"/>
  <!-- 6시 -->
  <rect x="506" y="840" width="12" height="52" rx="6" fill="#AEAEB2"/>
  <!-- 9시 -->
  <rect x="132" y="506" width="52" height="12" rx="6" fill="#AEAEB2"/>

  <!-- 보조 눈금 (1,2,4,5,7,8,10,11시) — 작은 점 -->
  <!-- 1시 (30°) -->
  <rect x="683" y="166" width="8" height="32" rx="4" fill="#636366"
        transform="rotate(30, 512, 512)"/>
  <!-- 2시 (60°) -->
  <rect x="683" y="166" width="8" height="32" rx="4" fill="#636366"
        transform="rotate(60, 512, 512)"/>
  <!-- 4시 (120°) -->
  <rect x="683" y="166" width="8" height="32" rx="4" fill="#636366"
        transform="rotate(120, 512, 512)"/>
  <!-- 5시 (150°) -->
  <rect x="683" y="166" width="8" height="32" rx="4" fill="#636366"
        transform="rotate(150, 512, 512)"/>
  <!-- 7시 (210°) -->
  <rect x="683" y="166" width="8" height="32" rx="4" fill="#636366"
        transform="rotate(210, 512, 512)"/>
  <!-- 8시 (240°) -->
  <rect x="683" y="166" width="8" height="32" rx="4" fill="#636366"
        transform="rotate(240, 512, 512)"/>
  <!-- 10시 (300°) -->
  <rect x="683" y="166" width="8" height="32" rx="4" fill="#636366"
        transform="rotate(300, 512, 512)"/>
  <!-- 11시 (330°) -->
  <rect x="683" y="166" width="8" height="32" rx="4" fill="#636366"
        transform="rotate(330, 512, 512)"/>

  <!-- ===== 시침 (10시 10분 포지션 — 황금비율) ===== -->
  <!-- 시침: 약 300° (10시 방향) -->
  <!-- 시침 끝 좌표 계산: 300° = -60° from 12시
       x = 512 + 220*sin(-60°) = 512 - 190.5 ≈ 322
       y = 512 - 220*cos(-60°) = 512 - 110 = 402 -->
  <line x1="512" y1="512"
        x2="322" y2="402"
        stroke="url(#hourHandGrad)" stroke-width="22" stroke-linecap="round"/>
  <!-- 시침 반대 방향 짧은 테일 -->
  <line x1="512" y1="512"
        x2="557" y2="537"
        stroke="#AEAEB2" stroke-width="22" stroke-linecap="round" opacity="0.4"/>

  <!-- ===== 분침 (10시 10분 포지션) ===== -->
  <!-- 분침: 약 60° (2시 방향)
       x = 512 + 290*sin(60°) = 512 + 251 = 763
       y = 512 - 290*cos(60°) = 512 - 145 = 367 -->
  <line x1="512" y1="512"
        x2="763" y2="367"
        stroke="url(#minHandGrad)" stroke-width="14" stroke-linecap="round"/>
  <!-- 분침 테일 -->
  <line x1="512" y1="512"
        x2="463" y2="542"
        stroke="#D1D1D6" stroke-width="14" stroke-linecap="round" opacity="0.35"/>

  <!-- ===== 초침 (아이콘 포인트 컬러 — 오렌지) ===== -->
  <!-- 초침: 약 170° (약 34초 방향)
       x = 512 + 310*sin(170°) = 512 + 53.8 ≈ 566
       y = 512 - 310*cos(170°) = 512 + 305 ≈ 817 -->
  <line x1="512" y1="512"
        x2="566" y2="817"
        stroke="#FF6B35" stroke-width="6" stroke-linecap="round"/>
  <!-- 초침 테일 (반대) -->
  <line x1="512" y1="512"
        x2="490" y2="400"
        stroke="#FF6B35" stroke-width="6" stroke-linecap="round"/>

  <!-- 중앙 캡 — 겹층 -->
  <circle cx="512" cy="512" r="24" fill="#3A3A3C"/>
  <circle cx="512" cy="512" r="16" fill="#FF6B35"/>
  <circle cx="512" cy="512" r="7" fill="#1C1C1E"/>

  <!-- 시계판 유리 반사광 (상단 하이라이트) -->
  <ellipse cx="440" cy="340" rx="120" ry="80"
           fill="#FFFFFF" opacity="0.025"/>

  <!-- 베젤 내부 링 (미묘한 구분선) -->
  <circle cx="512" cy="512" r="401" fill="none" stroke="#FFFFFF" stroke-width="0.5" opacity="0.05"/>
</svg>
